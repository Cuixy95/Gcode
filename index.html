  "sections": [
    {
      "t": "一、原理与认知",
      "items": [
        {
          "q": "什么是无结子线？",
          "a": "<p>钩柄处<b>不打结</b>。用一根更细的绑制线把子线一圈一圈勒紧、压在钩柄上，再点胶固化，靠缠绕层受力固定。</p>"
        },
        {
          "q": "无结和手绑有什么区别？",
          "a": "<p>手绑是子线在钩柄上打结；无结把这颗结整个去掉。因为断线绝大多数都断在结上，所以近钩端的有效拉力更接近线本身的强度。</p><p>另一个区别是一致性：机器绑的每一副都一样，不靠个人手感。</p>"
        },
        {
          "q": "无结子线是智商税吗？",
          "a": "<p>不是，但也不必神话。手绑打得好的人，成品本来就不差——这话是对的。</p><p>无结真正的优势是<b>每一副都一样、可批量复制、不依赖手感</b>，而不是“拉力无敌”。</p>"
        },
        {

          "a": "<p>不给百分比承诺。公开的钓鱼教学口径是：<b>好的结能保留 90% 以上强度，差的结保留不到一半</b>（伊利诺伊州自然资源部钓鱼教学页）。</p><p>无结的意义是把结果<b>稳定在高水平</b>；具体数值取决于你的线和钩，先试绑才有结论。</p>"
        },
        {
          "q": "是不是整条线组都没有结了？",
          "a": "<p>八字环处可以绑单丝双刃或者双丝双刃，可进一步提升拉力值。</p><p>只绑钩为半无结，八字环也绑制加固为全无结</p>"
        },
        {
          "q": "无结子线有什么缺点？",
          "a": "<p>三点如实说：</p><ul><li>钩柄处会变粗、略微增重，钓极轻口时手绑仍有优势；</li><li>单价高于手绑（多了绑制线和胶水）；</li><li>有材料限制：碳线、异形钩等不适用。</li></ul>"
        }
      ]
    },
    {
      "t": "二、能不能绑我的线和钩",
      "items": [
        {
          "q": "能绑哪些子线？",
          "a": "<p>常见尼龙线基本都可以，优先选标着“无结子线专用”的线。</p><p>已验证型号：<b>sy88、sy96、ps99s、a78n、dad92 无结版</b> 等。</p>"
        },
        {
          "q": "哪些线不建议绑？",
          "a": "<p>碳线、伴碳、柔碳，以及特别硬滑、带镀层的线。</p><p>碳线普遍偏硬、不容易压住，买不到商用无结碳线的话，绑出来大概率会切钩柄。</p>"
        },
        {
          "q": "能绑哪些钩型？",
          "a": "<p>市面上常见的<b>无结钩型</b>都可以。</p><p>不支持：异形钩、钩柄短又弯曲的、钩柄带深线槽的。</p>"
        },
        {

        {

        },
        {
          "q": "能绑碳线吗？",

        }
      ]

    {

          "q": "参数怎么调？先调哪个？",

        },
        {
          "q": "多少 D 的绑制线配什么子线？",
          "a": "<table><tr><th>绑制线</th><th>适用场景</th></tr><tr><td>45D</td><td>袖钩、狼牙、1.5 号以下子线，小钩隐形无结</td></tr><tr><td><b>75D</b></td><td><b>通用性最高，起步首选</b></td></tr><tr><td>100D</td><td>可沿用 75D 参数，拉力略大</td></tr><tr><td>120D / 140D</td><td>巨物子线</td></tr><tr><td>150D / 200D / 300D</td><td>全无结专用程序（两段密度）</td></tr></table><p>以上为参考值。密度、宽度、层数要根据你自己的绑制线、子线、钩和张力动态微调。</p>"
        },
        {
          "q": "什么是打底？为什么必须打？",
          "a": "<p>打底就是在钩柄上先缠一层。</p><p>作用有两个：<b>建立摩擦力</b>、<b>遮盖钩柄镀层</b>。镀层钩不打底，后面的缠绕层会整体打滑。</p>"

        },
        {
          "q": "能退吗？有质保吗？",
          "a": "<p>如实说明：不是厂家，<b>没有质保</b>。</p><p>2 天内可退；无理由寄回由客户承担来回运费，退款需扣除运费 + 包装费 20 元。维修配件按成本价 + 运费。</p>"
        },
        {
          "q": "好不好学？多久能上手？",
          "a": "<p>自带 25 条基础程序，常用钩型有现成文件，不用从零编。难点只有三处：<b>装钩要平、起点留 1mm、起步要拉紧</b>。</p><p>这三点做到就能出成品，售后群里一直有远程视频指导。</p>"
        },
        {
          "q": "一小时能绑多少副？",
          "a": "<p><span class='todo'>待填：熟练工 / 新手 / 含点胶固化的实测时产</span></p><p>我们不给估算值，避免和你实际使用有偏差。</p>"
        },
        {
          "q": "机器容易坏吗？易损件是什么？",
          "a": "<p>主要易损件是<b>导嘴</b>（撞钩或起点设置不当会撞断）。</p><p>只要做到“钩夹平、起点留安全距离”，正常使用损耗很低。易损件价格：<span class='todo'>待填：导嘴等价格</span></p>"
        },
        {
          "q": "占地多大？电压？要不要空压机？",
          "a": "<p><span class='todo'>待填：机器尺寸、重量、功率、工作台要求</span></p>"
        }
      ]
    },
    {
      "t": "六、售后与异常排查",
      "items": [
        {
          "q": "出现问题，第一步做什么？",
          "a": "<p>① 先停机，不要连踩脚踏；② 按下面的现象清单查，<b>一次只改一个参数</b>；③ 改完先空跑，再上钩验证。</p><p>说不清就拍视频发售后群，视频指导一直有效。</p>"
        },
        {
          "q": "开机后动作错乱、乱走位",
          "a": "<p>没回零。先按 <b>B 键</b>回零，显示空闲状态后再操作。</p>"
        },
        {
          "q": "导嘴撞钩，甚至撞断导嘴",
          "a": "<p>钩子没夹平。重新夹平鱼钩，检查起点是否太靠里；换上新的导嘴。</p>"
        },
        {
          "q": "绑制线被切断",
          "a": "<p>起点太靠钩柄弯。把起点外移 <b>1mm</b>，并核对所选程序的宽度小于起点值。</p>"
        },
        {
          "q": "子线抽脱、拉几下就松",
          "a": "<p>起步张力不足，或密度、层数不够。按 <b>张力 → 密度 → 层数</b> 依次上调。</p>"
        },
        {
          "q": "切钩柄（成品在钩柄处断）",
          "a": "<p>线太硬滑（多为碳线）、张力过大或缠绕勒伤。按 <b>换线 → 降张力 → 降密度</b> 处理。</p>"
        },
        {
          "q": "缠绕层整体打滑",
          "a": "<p>钩柄有镀层、摩擦不足。打底整层遮盖，并加松香粉。</p>"
        },
        {
          "q": "缠绕层重叠、堆成一坨",
          "a": "<p>密度与绑制线 D 数不匹配。按 D 数重选密度。</p>"
        },
        {
          "q": "成品长短不一",
          "a": "<p>熟练度问题，拽线力度不均匀，规范卡线动作。</p>"
        },
        {
          "q": "绑制线起毛、断丝",
          "a": "<p>张力过大、导嘴磨损，绑制线已经接近拉力极限。按 <b>降张力 → 换绑制线 → 检查导嘴</b> 处理。</p>"
        }
      ]
    }
  ]
};
/* ==== DATA-END ==== */

(function(){
  "use strict";
  var biz = DATA.biz, sections = DATA.sections;
  var INDEX = [], total = 0, todoCount = 0;

  sections.forEach(function(sec, si){
    sec.id = "s" + (si + 1);
    sec.items.forEach(function(it){
      total++;
      it.n = total;
      it.sec = sec;
      var a = String(it.a);
      if (a.indexOf("class='todo'") >= 0 || a.indexOf('class="todo"') >= 0) todoCount++;
      INDEX.push(it);
    });
  });

  function $(id){ return document.getElementById(id); }
  var bar = $("back"), home = $("home"), qa = $("qa");
  var input = $("q"), hint = $("hint"), tocEl = $("toc"), emptyEl = $("empty");
  var savedScroll = 0;

  $("kicker").textContent = biz.kicker;
  $("doctitle").textContent = biz.title;
  $("h1").textContent = biz.title;
  $("sub").textContent = biz.subtitle;
  $("foot").innerHTML = esc(biz.contact) + " · " + esc(biz.version) + "<br><br>" + esc(biz.disclaimer);
  document.title = biz.title;
  input.placeholder = "输入关键词搜索，例如：" + (biz.hot || []).slice(0, 3).join("、");

  var hotBox = $("hot");
  (biz.hot || []).forEach(function(word){
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = word;
    b.addEventListener("click", function(){
      input.value = word;
      runSearch();
      input.focus();
    });
    hotBox.appendChild(b);
  });

  var tocHtml = "";
  sections.forEach(function(sec){
    tocHtml += '<div class="secblk"><div class="secname">' + esc(sec.t) + "</div>";
    sec.items.forEach(function(it){
      tocHtml += '<button class="qitem" data-n="' + it.n + '">' +
        '<span class="n">' + it.n + "</span><span>" + esc(it.q) + '</span><span class="arrow">›</span></button>';
    });
    tocHtml += "</div>";
  });
  tocEl.innerHTML = tocHtml;

  if (todoCount > 0){
    var warn = $("warn");
    warn.style.display = "block";
    warn.innerHTML = "维护提示：本页还有 <b>" + todoCount + " 处待补数据</b>（带底色的“待填”标记）。补全后再对外发布效果最好。";
  }

  function runSearch(){
    var kw = input.value.trim().toLowerCase();
    var hit = 0;
    var blocks = tocEl.querySelectorAll(".secblk");
    for (var i = 0; i < blocks.length; i++){
      var items = blocks[i].querySelectorAll(".qitem"), shown = 0;
      for (var j = 0; j < items.length; j++){
        var it = INDEX[parseInt(items[j].getAttribute("data-n"), 10) - 1];
        var hay = (it.q + " " + String(it.a).replace(/<[^>]+>/g, " ")).toLowerCase();
        var ok = !kw || hay.indexOf(kw) >= 0;
        items[j].hidden = !ok;
        if (ok){ shown++; hit++; }
      }
      blocks[i].hidden = shown === 0;
    }
    $("clear").hidden = !kw;
    $("tocTitle").textContent = kw ? ("搜索结果 · " + hit + " 条") : ("目录 · 共 " + INDEX.length + " 条问题");
    hint.textContent = kw ? "" : ("共 " + INDEX.length + " 条问题，可按关键词搜索，也可直接点目录");
    emptyEl.hidden = !(kw && hit === 0);
  }
  input.addEventListener("input", runSearch);
  $("clear").addEventListener("click", function(){ input.value = ""; runSearch(); input.focus(); });

  tocEl.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest(".qitem") : null;
    if (t) location.hash = "#q" + t.getAttribute("data-n");
  });

  function showHome(){
    qa.hidden = true; home.hidden = false; bar.hidden = true;
    document.title = biz.title;
    window.scrollTo(0, savedScroll || 0);
  }
  function showQA(num){
    var it = INDEX[num - 1];
    if (!it){ showHome(); return; }
    if (!home.hidden) savedScroll = window.pageYOffset;
    home.hidden = true; qa.hidden = false; bar.hidden = false;
    $("crumbSec").textContent = it.sec.t;
    $("qtitle").textContent = it.n + " · " + it.q;
    $("ansBody").innerHTML = it.a;
    document.title = it.q + " · " + biz.title;
    var prev = $("prev"), next = $("next");
    prev.disabled = it.n <= 1;
    next.disabled = it.n >= INDEX.length;
    prev.onclick = function(){ if (it.n > 1) location.hash = "#q" + (it.n - 1); };
    next.onclick = function(){ if (it.n < INDEX.length) location.hash = "#q" + (it.n + 1); };
    var sibs = it.sec.items.filter(function(x){ return x.n !== it.n; }).slice(0, 5);
    $("sibTitle").textContent = it.sec.t + " · 其他问题";
    $("sib").innerHTML = sibs.map(function(x){
      return '<button class="qitem" data-n="' + x.n + '"><span class="n">' + x.n + "</span><span>" + esc(x.q) + '</span><span class="arrow">›</span></button>';
    }).join("");
    $("sibCard").hidden = sibs.length === 0;
    window.scrollTo(0, 0);
  }
  $("sib").addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest(".qitem") : null;
    if (t) location.hash = "#q" + t.getAttribute("data-n");
  });
  $("back").addEventListener("click", function(){ location.hash = "#home"; });
  $("back2").addEventListener("click", function(){ location.hash = "#home"; });

  function route(){
    var m = /^#q(\d+)$/.exec(location.hash || "");
    if (m) showQA(parseInt(m[1], 10));
    else showHome();
  }
  window.addEventListener("hashchange", route);

  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.className = "on";
    setTimeout(function(){ t.className = ""; }, 1700);
  }
  function copyText(text, okMsg){
    var done = function(){ toast(okMsg || "已复制"); };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }
  function fallback(text, done){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else toast("复制失败，请长按选择文本");
  }
  $("copyA").addEventListener("click", function(){
    var m = /^#q(\d+)$/.exec(location.hash || "");
    if (!m) return;
    var it = INDEX[parseInt(m[1], 10) - 1];
    var body = document.getElementById("ansBody");
    copyText(it.q + "\n" + (body.innerText || body.textContent), "答案已复制");
  });
  $("copyL").addEventListener("click", function(){
    if (location.protocol === "file:"){
      toast("本地文件模式：上传成网址后此处才可复制");
      return;
    }
    copyText(location.href.split("#")[0] + location.hash, "链接已复制");
  });

  var top = $("top");
  window.addEventListener("scroll", function(){
    top.style.display = window.pageYOffset > 500 ? "flex" : "none";
  }, { passive: true });
  top.addEventListener("click", function(){ window.scrollTo({ top: 0, behavior: "smooth" }); });

  runSearch();
  route();
})();

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
